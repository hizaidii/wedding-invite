body{position:relative;background:radial-gradient(85% 120% at 50% 42%,#1B5D46 0%,#114634 46%,#0A3124 80%,#072219 100%);font-family:"Cormorant Garamond",Georgia,serif;-webkit-font-smoothing:antialiased}
.defs{position:absolute;width:0;height:0}
.lattice{position:absolute;inset:0;background:var(--lattice-dark);background-size:60px 60px;background-position:center;opacity:.75;-webkit-mask-image:radial-gradient(70% 90% at 50% 50%,#000 30%,rgba(0,0,0,.25) 100%)}

.seal{width:150px;height:150px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(233,196,120,.22))}

.mono{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:27px;letter-spacing:.5px}
.mono-amp{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:20px}
.kicker{margin-top:26px;font-family:Marcellus,Georgia,serif;font-size:17px;letter-spacing:.36em;padding-left:.36em;text-transform:uppercase;color:var(--gold-2)}

.names i{font-weight:500;font-size:.8em;padding:0 .08em}
.orn{display:flex;align-items:center;gap:14px;margin:14px 0 16px;color:var(--gold)}
.orn b{display:block;width:120px;height:1px;background:linear-gradient(90deg,transparent,currentColor)}

.date{font-family:Marcellus,Georgia,serif;font-size:23px;letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;color:var(--gold-3)}

<script>
/* Two sagging strands of fairy lights across the top. */
const NS = "http://www.w3.org/2000/svg", strands = document.getElementById("strands"), bulbs = document.getElementById("bulbs");
[[-20, 18, 600, 26, 92], [600, 26, 1220, 16, 88]].forEach(([x1, y1, x2, y2, sag]) => {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + sag * 2;
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`);
  strands.appendChild(p);
  for (let i = 1; i < 16; i++) {
    const t = i / 16, x = (1 - t) ** 2 * x1 + 2 * (1 - t) * t * mx + t * t * x2, y = (1 - t) ** 2 * y1 + 2 * (1 - t) * t * my + t * t * y2;
    const r = i % 3 === 0 ? 15 : 11;
    const g = document.createElementNS(NS, "circle");
    g.setAttribute("cx", x.toFixed(1)); g.setAttribute("cy", (y + 5).toFixed(1)); g.setAttribute("r", r); g.setAttribute("fill", "url(#bulb)");
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", (y + 5).toFixed(1)); c.setAttribute("r", 2.2); c.setAttribute("fill", "#FFF6DC");
    bulbs.append(g, c);
  }
});
</script>
